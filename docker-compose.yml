# =============================================================
# DocuMind AI — Production Docker Compose
# =============================================================
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose up --build
#   3. Open http://localhost:80
#
# Services:
#   - db        → PostgreSQL 16
#   - backend   → FastAPI (uvicorn, 2 workers)
#   - frontend  → React SPA served via Nginx (proxies /api to backend)
# =============================================================

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: documind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-documind}
      POSTGRES_USER:     ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind} -d ${POSTGRES_DB:-documind}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - documind_net

  # ──────────────────────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Application
      PROJECT_NAME:    "DocuMind AI"
      VERSION:         "1.0.0"
      ENVIRONMENT:     ${ENVIRONMENT:-production}
      DEBUG:           "false"

      # Database — uses the db service name as host
      DATABASE_URL:    postgresql://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-documind}

      # Security
      SECRET_KEY:      ${SECRET_KEY:?SECRET_KEY must be set in .env}

      # OCR
      OCR_PROVIDER:    ${OCR_PROVIDER:-easyocr}
      OCR_USE_GPU:     "false"
      POPPLER_PATH:    ${POPPLER_PATH:-}

      # LLM
      LLM_PROVIDER:        ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY:  ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL:    ${OPENROUTER_MODEL:-google/gemini-2.5-flash}

      # Storage
      STORAGE_PROVIDER: local
      UPLOAD_DIR:       /app/uploads

      # CORS — frontend nginx is the only allowed origin in production
      CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
    volumes:
      - uploads_data:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - documind_net

  # ──────────────────────────────────────────────────────────
  # React Frontend (Nginx)
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: documind_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - documind_net

# ──────────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

# ──────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────
networks:
  documind_net:
    driver: bridge
